[package]
name = "iroh-webrtc"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "WebRTC DataChannel custom transport for iroh (native + browser)"
license = "MIT OR Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/n0-computer/iroh"
keywords = ["iroh", "webrtc", "p2p", "networking"]

[lib]
# `cdylib` lets the crate build directly to wasm for browser consumers (e.g. via Trunk).
crate-type = ["lib", "cdylib"]

[lints]
workspace = true

[features]
default = ["iroh-signaling", "tls-ring"]
# Helper that runs signaling on a dedicated ALPN over an iroh `Endpoint`.
iroh-signaling = []
# Forwarded crypto backend selection for consistency with the iroh endpoint.
tls-ring = ["iroh/tls-ring"]
tls-aws-lc-rs = ["iroh/tls-aws-lc-rs"]

[dependencies]
iroh = { version = "0.97", path = "../iroh", default-features = false, features = ["unstable-custom-transports"] }
iroh-base = { version = "0.97", path = "../iroh-base", default-features = false, features = ["key"] }
bytes = "1.11"
n0-future = "0.3"
n0-watcher = "0.6"
noq-udp = { version = "0.9", default-features = false }
postcard = { version = "1.1.1", features = ["use-std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.44", default-features = false, features = ["sync", "macros"] }
tracing = "0.1"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
str0m = "0.18"
tokio = { version = "1.44", features = ["rt", "net", "time", "sync", "macros"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "MessageEvent",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcDataChannelInit",
    "RtcDataChannelType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceConnectionState",
    "RtcIceGatheringState",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcIceServer",
] }
getrandom = { version = "0.4", features = ["wasm_js"] }
time = { version = "0.3", features = ["wasm-bindgen"] }

[dev-dependencies]
iroh = { path = "../iroh", features = ["unstable-custom-transports", "test-utils"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
n0-error = { version = "0.1", features = ["anyhow"] }
serde_json = "1"

[build-dependencies]
cfg_aliases = "0.2.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "iroh_docsrs"]

[[example]]
name = "webrtc-native"
