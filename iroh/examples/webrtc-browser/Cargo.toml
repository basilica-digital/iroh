[package]
name = "webrtc-browser-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { path = "../..", features = ["unstable-webrtc-transport", "tls-ring"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-tracing = "2.1.0"
tracing = "0.1"
n0-future = "0.3"
n0-error = "0.1"
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Document",
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "Window",
] }
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
time = { version = "0.3", features = ["wasm-bindgen"] }
